<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>404 - SIGNAL LOST</title>
        <link rel="icon" type="image/svg+xml" href="https://koboyo.com/icons/svg/axe.svg">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <script>
            (function() {
                var saved = localStorage.getItem('theme');
                var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
                document.documentElement.setAttribute('data-theme', theme);
            })();
        </script>
    </head>

    <body>
        <div class="crt-overlay"></div>

        <button class="theme-toggle" id="themeToggle">[ LIGHT ]</button>

        <main class="container">
            <div class="error-code">ERROR_CODE: 0x00000194</div>
            <h1>404 NOT FOUND</h1>
            <p class="error-desc">A fatal exception has occurred at your request routing logic. The specified target vector could not be located in the current volume directory.</p>

            <p class="command-prompt">JARGEDON-OS V1.0.4<br>
            &gt; locate --missing-sectors<br>
            &gt; sector tracking timed out...<br>
            &gt; <span class="cursor"></span></p>

            <div>
                <a href="/" class="btn-home">REBOOT TO CORE SYSTEMS (HOME)</a>
            </div>
        </main>

        <script src="theme.js" defer></script>
    </body>
</html>
