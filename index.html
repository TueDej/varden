<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Jargedon — personal services hub: file storage, media server, chat, card game, and digital library.">
        <title>Jargedon</title>
        <!-- Favicon: Koboyo axe icon -->
        <link rel="icon" type="image/svg+xml" href="https://koboyo.com/icons/svg/axe.svg">

        <!-- Google Fonts: VT323 for retro terminal look -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

        <style>
        :root {
            /* Dark Theme (Default) */
            --bg-color: #0a0a0a;
            --text-color: #33ff33; /* Classic Terminal Green */
            --accent-color: #33ff33;
            --scanline-color: rgba(0, 0, 0, 0.5);
            --button-bg: #111;
            --button-border: #33ff33;
            --button-hover-bg: #33ff33;
            --button-hover-text: #000;
            --shadow-glow: 0 0 10px rgba(51, 255, 51, 0.5);
            --tap-highlight: transparent;
            --ice-cream-opacity: 0.15;
        }

        [data-theme="light"] {
            /* Light Theme */
            --bg-color: #f0f4f8; /* Slightly icy blue-white */
            --text-color: #222;
            --accent-color: #ff85a2; /* Ice cream pink accent */
            --scanline-color: rgba(255, 255, 255, 0.3);
            --button-bg: #fff;
            --button-border: #222;
            --button-hover-bg: #ff85a2; /* originally: #222 */
            --button-hover-text: #fff;
            --shadow-glow: 0 0 5px rgba(0, 0, 0, 0.2);
            --ice-cream-opacity: 0.25;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: var(--tap-highlight);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'VT323', monospace;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: background-color 0.3s, color 0.3s;
        }

        /* CRT Scanline Effect Overlay */
        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                var(--scanline-color) 50%,
                transparent 50%
                );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
            opacity: 0.6;
        }

        /* Floating Ice Cream Background */
        .bg-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        /* Background decorative icons - fixed box so all icons align consistently */
        .bg-icon {
            position: absolute;
            opacity: var(--ice-cream-opacity);
            filter: blur(1px);
            animation: float 6s ease-in-out infinite;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bg-icon svg {
            display: block;
            height: 100%;
            width: auto;
            max-width: 100%;
        }

        .bg-icon:nth-child(odd) { animation-duration: 5s; animation-delay: -1s; }
        .bg-icon:nth-child(even) { animation-duration: 7s; animation-delay: -3s; }

        /* Random positions and sizes for ice creams - fixed square box, SVG scales inside */
        .bg-icon:nth-child(1) { top: 10%; left: 10%; width: 3rem; height: 3rem; animation-duration: 20s; }
        .bg-icon:nth-child(2) { top: 70%; left: 80%; width: 5rem; height: 5rem; animation-duration: 25s; animation-delay: -5s; }
        .bg-icon:nth-child(3) { top: 40%; left: 20%; width: 4rem; height: 4rem; animation-duration: 18s; animation-delay: -2s; }
        .bg-icon:nth-child(4) { top: 80%; left: 10%; width: 3.5rem; height: 3.5rem; animation-duration: 22s; animation-delay: -10s; }
        .bg-icon:nth-child(5) { top: 20%; left: 70%; width: 4.5rem; height: 4.5rem; animation-duration: 28s; animation-delay: -8s; }
        .bg-icon:nth-child(6) { top: 50%; left: 90%; width: 3rem; height: 3rem; animation-duration: 19s; animation-delay: -3s; }

        @keyframes cyberPulse {
            0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 2px #00ff00); }
            50% { opacity: 1; filter: drop-shadow(0 0 8px #00ff00); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        @keyframes flicker {
            0% { opacity: 0.97; }
            5% { opacity: 0.95; }
            10% { opacity: 0.9; }
            15% { opacity: 0.95; }
            20% { opacity: 0.99; }
            50% { opacity: 0.95; }
            80% { opacity: 0.9; }
            100% { opacity: 0.97; }
        }

        .container {
            text-align: center;
            z-index: 5;
            padding: 20px;
            max-width: 600px;
            width: 100%;
            animation: flicker 0.15s infinite;
            margin: auto 0;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            text-shadow: var(--shadow-glow);
            letter-spacing: 2px;
        }

        .welcome-msg {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        .welcome-msg::after {
            content: '█';
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .service-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 100%;
        }

        .service-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--button-bg);
            border: 2px solid var(--button-border);
            color: var(--text-color);
            padding: 15px 20px;
            text-decoration: none;
            font-size: 1.3rem;
            transition: all 0.2s ease;
            position: relative;
            box-shadow: 4px 4px 0px var(--button-border);
        }

        @media (hover: hover) {
            .service-btn:hover {
                background-color: var(--button-hover-bg);
                color: var(--button-hover-text);
                box-shadow: 4px 4px 0px var(--button-hover-bg), 0 0 15px var(--button-hover-bg);
                cursor: pointer;
            }
        }

        /* Two-column alignment: fixed grid for dot | icon | label ensures perfect vertical alignment */
        .btn-left {
            display: grid;
            grid-template-columns: 8px 32px 1fr;
            column-gap: 12px;
            align-items: center;
            justify-items: start;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #33ff33;
            box-shadow: 0 0 6px #33ff33;
            justify-self: center;
        }

        .status-dot.offline {
            background-color: #ff3333;
            box-shadow: 0 0 6px #ff3333;
        }

        .status-dot.degraded {
            background-color: #ffff33;
            box-shadow: 0 0 6px #ffff33;
        }

        /* Koboyo icon box - fixed 32px square, SVG scales inside with fixed height */
        .koboyo-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: currentColor;
        }

        .koboyo-icon svg {
            display: block;
            height: 22px;
            width: auto;
            max-width: 28px;
        }

        .service-name {
            line-height: 1;
            white-space: nowrap;
        }

        .description {
            font-size: 0.9rem;
            opacity: 0.7;
            text-align: right;
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .footer {
            margin-top: 3rem;
            font-size: 0.8rem;
            opacity: 0.5;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .footer-icon {
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .footer-icon svg {
            display: block;
            height: 14px;
            width: auto;
            max-width: 16px;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            padding: 5px 10px;
            font-family: 'VT323', monospace;
            cursor: pointer;
            z-index: 20;
            font-size: 1rem;
        }

        @media (hover: hover) {
            .theme-toggle:hover {
                background: var(--text-color);
                color: var(--bg-color);
            }
        }

        body.animations-paused * {
            animation-play-state: paused !important;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .service-btn {
                flex-direction: row;
                align-items: center;
                gap: 10px;
            }
            .description {
                font-size: 0.8rem;
            }
            .bg-icon:nth-child(1) { width: 2.5rem; height: 2.5rem; }
            .bg-icon:nth-child(2) { width: 3.5rem; height: 3.5rem; }
            .bg-icon:nth-child(3) { width: 3rem; height: 3rem; }
            .bg-icon:nth-child(4) { width: 2.8rem; height: 2.8rem; }
            .bg-icon:nth-child(5) { width: 3.2rem; height: 3.2rem; }
            .bg-icon:nth-child(6) { width: 2.5rem; height: 2.5rem; }
        }
    </style>
    <script>
        (function() {
            var saved = localStorage.getItem('theme');
            var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    </head>

        <script>
            const toggleBtn = document.getElementById('themeToggle');
            const docEl = document.documentElement;

            // Typing effect for welcome message
            const welcomeMsg = document.querySelector('.welcome-msg');
            const text = welcomeMsg.textContent;
            welcomeMsg.textContent = '';
            let i = 0;

            function typeWriter() {
                if (i < text.length) {
                    welcomeMsg.textContent += text.charAt(i);
                    i++;
                    setTimeout(typeWriter, 50);
                }
            }

            typeWriter();

            // Sync toggle button text with theme set by head script
            updateButtonText(docEl.getAttribute('data-theme'));

            toggleBtn.addEventListener('click', () => {
                const current = docEl.getAttribute('data-theme');
                const newTheme = current === 'dark' ? 'light' : 'dark';

                docEl.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                updateButtonText(newTheme);
            });

            function updateButtonText(theme) {
                toggleBtn.textContent = theme === 'dark' ? '[ LIGHT ]' : '[ DARK ]';
            }

            // Pause animations when tab is not visible
            document.addEventListener('visibilitychange', () => {
                document.body.classList.toggle('animations-paused', document.hidden);
            });
        </script>
